<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish Transpiler</title>
  <!-- Pyodide CDN -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 20px;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 {
      margin-bottom: 5px;
      color: #f8fafc;
    }
    #status {
      font-weight: bold;
      color: #f59e0b;
      margin-bottom: 15px;
    }

    /* Top Controls Bar */
    .controls-bar {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
      background-color: #1e293b;
      padding: 12px 16px;
      border: 1px solid #334155;
      border-radius: 8px;
    }
    .controls-bar label {
      font-weight: bold;
      color: #cbd5e1;
    }
    select {
      background-color: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    select:focus {
      outline: 2px solid #3b82f6;
    }

    /* Main Grid Layout */
    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .box {
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: bold;
      margin-bottom: 8px;
      color: #cbd5e1;
    }
    textarea {
      width: 100%;
      height: 380px;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 14px;
      line-height: 1.5;
      padding: 12px;
      background-color: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      resize: vertical;
    }
    textarea:focus {
      outline: 2px solid #3b82f6;
      border-color: transparent;
    }

    /* Arguments Section */
    .args-section {
      margin-top: 20px;
      background-color: #1e293b;
      padding: 16px;
      border: 1px solid #334155;
      border-radius: 8px;
    }
    .args-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .args-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .arg-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .arg-input {
      flex: 1;
      height: 90px;
      background-color: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 14px;
      line-height: 1.4;
      resize: vertical;
    }
    .arg-input:focus {
      outline: 2px solid #3b82f6;
      border-color: transparent;
    }

    /* Action Buttons Bar */
    .actions-bar {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    /* Output Section */
    .output-section {
      margin-top: 20px;
    }
    .output-section textarea {
      height: 160px;
      background-color: #020617;
      color: #38bdf8;
    }

    /* Buttons */
    button {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .btn-primary {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #2563eb;
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: #1d4ed8;
    }
    .btn-run {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #10b981;
      color: white;
    }
    .btn-run:hover:not(:disabled) {
      background-color: #059669;
    }
    button:disabled {
      background-color: #334155 !important;
      color: #64748b !important;
      cursor: not-allowed;
    }
    .btn-add {
      background-color: #059669;
      color: white;
    }
    .btn-add:hover {
      background-color: #047857;
    }
    .btn-remove {
      background-color: #dc2626;
      color: white;
      padding: 8px 12px;
    }
    .btn-remove:hover {
      background-color: #b91c1c;
    }

    /* Footer */
    footer {
      margin-top: 40px;
      padding: 20px 0;
      text-align: center;
      border-top: 1px solid #334155;
      color: #94a3b8;
      font-size: 14px;
    }
    footer a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: bold;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>Fish Transpiler Online</h1>
  <div id="status">Loading Python runtime (Pyodide)...</div>

  <!-- Examples Selection Bar -->
  <div class="controls-bar">
    <label for="exampleSelect">Select Example:</label>
    <select id="exampleSelect" onchange="onExampleChange()">
      <option value="test/tutorial/tutorial.c">test/tutorial/tutorial.c</option>
    </select>
  </div>

  <!-- Main Code Container -->
  <div class="container">
    <div class="box">
      <label for="inputCode">Source Code (.c):</label>
      <textarea id="inputCode" placeholder="Type or select C-like code..."></textarea>
    </div>

    <div class="box">
      <label for="outputCode">Generated Fish (.z) Code:</label>
      <textarea id="outputCode" readonly placeholder="Transpiled code will appear here..."></textarea>
    </div>
  </div>

  <!-- Program Arguments UI -->
  <div class="args-section">
    <div class="args-header">
      <label>Input Arguments (.i file inputs):</label>
      <button type="button" class="btn-add" onclick="addArgument('')">+ Add Argument</button>
    </div>
    <div id="argsContainer" class="args-list"></div>
  </div>

  <!-- Action Buttons -->
  <div class="actions-bar">
    <button id="transpileBtn" class="btn-primary" disabled onclick="runTranspiler()">Transpile</button>
    <button id="runBtn" class="btn-run" disabled onclick="runFishCode()">▶ Run Code</button>
  </div>

  <!-- Execution Output -->
  <div class="output-section">
    <label for="executionOutput">Execution Output:</label>
    <textarea id="executionOutput" readonly placeholder="Interpreter output will appear here after clicking 'Run Code'..."></textarea>
  </div>

  <!-- Footer -->
  <footer>
    View source on <a id="githubLink" href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>

  <script>
    let pyodide;

    async function initPyodide() {
      const statusEl = document.getElementById("status");
      const transpileBtn = document.getElementById("transpileBtn");
      const runBtn = document.getElementById("runBtn");

      try {
        // Initialize Pyodide WASM environment
        pyodide = await loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"
        });

        // 1. Fetch fishgen.py from root repository folder
        const fgResponse = await fetch('fishgen.py');
        if (!fgResponse.ok) {
          throw new Error("Could not find fishgen.py in repository.");
        }
        const fishgenSource = await fgResponse.text();
        pyodide.globals.set("fishgen_source_code", fishgenSource);

        // 2. Fetch fish.py from root repository folder
        const fishResponse = await fetch('fish.py');
        if (!fishResponse.ok) {
          console.warn("Could not find fish.py in repository. 'Run Code' may fail.");
        } else {
          const fishSource = await fishResponse.text();
          pyodide.globals.set("fish_source_code", fishSource);
        }

        // Execute fishgen script in Pyodide
        pyodide.runPython(`
mod_globals = {'__name__': 'fishgen'}
exec(fishgen_source_code, mod_globals)
FishTranspiler = mod_globals['FishTranspiler']
        `);

        statusEl.innerText = "Pyodide Ready!";
        statusEl.style.color = "#22c55e";
        transpileBtn.disabled = false;
        runBtn.disabled = false;

        // Load example list and set default example
        await discoverExamples();
        await loadExample("test/tutorial/tutorial.c");

      } catch (err) {
        statusEl.innerText = "Initialization Failed: " + err.message;
        statusEl.style.color = "#ef4444";
        console.error(err);
      }
    }

    /* --- ARGUMENT MANAGEMENT --- */

    function addArgument(value = '') {
      const container = document.getElementById("argsContainer");
      
      const row = document.createElement("div");
      row.className = "arg-row";

      const textarea = document.createElement("textarea");
      textarea.className = "arg-input";
      textarea.value = value;
      textarea.placeholder = "Enter argument / stdin input...";

      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "btn-remove";
      removeBtn.innerText = "×";
      removeBtn.onclick = () => row.remove();

      row.appendChild(textarea);
      row.appendChild(removeBtn);
      container.appendChild(row);
    }

    function clearArguments() {
      document.getElementById("argsContainer").innerHTML = "";
    }

    function getArguments() {
      const inputs = document.querySelectorAll(".arg-input");
      return Array.from(inputs).map(input => input.value);
    }

    /* --- EXAMPLE & FILE LOADING --- */

    async function discoverExamples() {
      const select = document.getElementById("exampleSelect");
      const githubLink = document.getElementById("githubLink");
      let exampleFiles = ["test/tutorial/tutorial.c"];

      try {
        const hostname = window.location.hostname;
        const pathParts = window.location.pathname.split('/').filter(Boolean);

        if (hostname.endsWith(".github.io") && pathParts.length > 0) {
          const owner = hostname.split('.')[0];
          const repo = pathParts[0];

          // Set dynamic repository footer link
          githubLink.href = `https://github.com/${owner}/${repo}`;

          async function fetchTree(dirPath) {
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${dirPath}`;
            const res = await fetch(apiUrl);
            if (!res.ok) return [];
            
            const items = await res.json();
            let files = [];
            for (const item of items) {
              if (item.type === "file" && item.name.endsWith(".c")) {
                files.push(item.path);
              } else if (item.type === "dir") {
                const subFiles = await fetchTree(item.path);
                files = files.concat(subFiles);
              }
            }
            return files;
          }

          const githubFiles = await fetchTree("test");
          if (githubFiles.length > 0) {
            exampleFiles = githubFiles;
          }
        }
      } catch (e) {
        console.warn("Could not discover examples automatically via GitHub API:", e);
      }

      // Populate dropdown options
      select.innerHTML = "";
      exampleFiles.sort().forEach(filePath => {
        const option = document.createElement("option");
        option.value = filePath;
        option.innerText = filePath;
        select.appendChild(option);
      });

      // Ensure default selection is test/tutorial/tutorial.c
      if (exampleFiles.includes("test/tutorial/tutorial.c")) {
        select.value = "test/tutorial/tutorial.c";
      }
    }

    async function loadExample(cFilePath) {
      const inputEl = document.getElementById("inputCode");

      try {
        // 1. Fetch .c source code
        const cRes = await fetch(cFilePath);
        if (cRes.ok) {
          inputEl.value = await cRes.text();
          runTranspiler();
        } else {
          inputEl.value = `// Failed to load ${cFilePath}`;
        }

        // 2. Fetch corresponding .i input arguments file
        clearArguments();
        const iFilePath = cFilePath.replace(/\.c$/, '.i');
        const iRes = await fetch(iFilePath);

        if (iRes.ok) {
          const iText = await iRes.text();
          // Parse .i content split by double newlines (\n\n)
          const rawArgs = iText.replace(/\r\n/g, "\n").split("\n\n");
          const parsedArgs = rawArgs.map(arg => arg.trim()).filter(arg => arg !== "");
          
          parsedArgs.forEach(argVal => addArgument(argVal));
        }
      } catch (err) {
        console.error("Error loading example:", err);
      }
    }

    function onExampleChange() {
      const selectedPath = document.getElementById("exampleSelect").value;
      loadExample(selectedPath);
    }

    /* --- TRANSPILER & RUNNER EXECUTION --- */

    function runTranspiler() {
      if (!pyodide) return;

      const sourceCode = document.getElementById("inputCode").value;
      const outputEl = document.getElementById("outputCode");

      try {
        pyodide.globals.set("user_source_code", sourceCode);

        pyodide.runPython(`
transpiler = FishTranspiler()
transpiled_output = transpiler.transpile(user_source_code)
        `);

        outputEl.value = pyodide.globals.get("transpiled_output");
      } catch (err) {
        outputEl.value = "Transpilation Error:\n" + err.message;
      }
    }

    function runFishCode() {
      if (!pyodide) return;
    
      // Re-transpile before running
      runTranspiler();
    
      const transpiledCode = document.getElementById("outputCode").value;
      const args = getArguments();
      const outputEl = document.getElementById("executionOutput");
    
      outputEl.value = "Running...";
    
      try {
        pyodide.globals.set("user_fish_code", transpiledCode);
        pyodide.globals.set("user_args", args);
    
        pyodide.runPython(`
    import sys
    import io
    import types
    
    # 1. Mock missing terminal modules (termios & tty) for browser/Pyodide
    if 'termios' not in sys.modules:
        termios_mock = types.ModuleType('termios')
        termios_mock.TCSADRAIN = 0
        termios_mock.tcgetattr = lambda fd: [0, 0, 0, 0, 0, 0, []]
        termios_mock.tcsetattr = lambda fd, opt, settings: None
        sys.modules['termios'] = termios_mock
    
    if 'tty' not in sys.modules:
        tty_mock = types.ModuleType('tty')
        tty_mock.setraw = lambda fd: None
        tty_mock.setcbreak = lambda fd: None
        sys.modules['tty'] = tty_mock
    
    # 2. Capture stdout and stderr
    old_stdout, old_stderr = sys.stdout, sys.stderr
    sys.stdout = stdout_buf = io.StringIO()
    sys.stderr = stderr_buf = io.StringIO()
    
    # 3. Write code.z to virtual filesystem
    with open("code.z", "w", encoding="utf-8") as f:
        f.write(user_fish_code)
    
    # 4. Construct CLI arguments: python3 fish.py code.z -- "arg1" "arg2"
    sys.argv = ["fish.py", "code.z"]
    if user_args:
        sys.argv.append("--")
        sys.argv.extend(user_args)
    
    try:
        fish_globals = {'__name__': '__main__'}
        exec(fish_source_code, fish_globals)
    except SystemExit:
        pass  # Handle CLI sys.exit cleanly
    except Exception as ex:
        print(f"Runtime Exception: {ex}", file=sys.stderr)
    finally:
        sys.stdout = old_stdout
        sys.stderr = old_stderr
    
    run_result = stdout_buf.getvalue() + stderr_buf.getvalue()
        `);
    
        outputEl.value = pyodide.globals.get("run_result") || "(No output produced)";
      } catch (err) {
        outputEl.value = "Execution Error:\n" + err.message;
      }
    }

    initPyodide();
  </script>

</body>
</html>
