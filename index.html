<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish Transpiler</title>
  <!-- Pyodide CDN -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 20px;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 {
      margin-bottom: 5px;
      color: #f8fafc;
    }
    #status {
      font-weight: bold;
      color: #f59e0b;
      margin-bottom: 15px;
    }
    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .box {
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: bold;
      margin-bottom: 8px;
      color: #cbd5e1;
    }
    textarea {
      width: 100%;
      height: 420px;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 14px;
      line-height: 1.5;
      padding: 12px;
      background-color: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      resize: vertical;
    }
    textarea:focus {
      outline: 2px solid #3b82f6;
      border-color: transparent;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover:not(:disabled) {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #334155;
      color: #64748b;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h1>Fish Transpiler Online</h1>
  <div id="status">Loading Python runtime (Pyodide)...</div>

  <div class="container">
    <div class="box">
      <label for="inputCode">Source Code:</label>
      <textarea id="inputCode" placeholder="Type your C-like code here...">
i = 1
j = 2
if i < j {
    println(i)
}
      </textarea>
    </div>

    <div class="box">
      <label for="outputCode">Generated Fish (.z) Code:</label>
      <textarea id="outputCode" readonly placeholder="Output will appear here..."></textarea>
    </div>
  </div>

  <button id="transpileBtn" disabled onclick="runTranspiler()">Transpile</button>

  <script>
    let pyodide;

    async function initPyodide() {
      const statusEl = document.getElementById("status");
      const btnEl = document.getElementById("transpileBtn");

      try {
        // Initialize Pyodide WASM environment
        pyodide = await loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"
        });

        // Fetch fishgen.py from root repository folder
        const response = await fetch('fishgen.py');
        if (!response.ok) {
          throw new Error("Could not find fishgen.py in repository.");
        }
        const fishgenSource = await response.text();

        // Pass script source into Pyodide globals
        pyodide.globals.set("fishgen_source_code", fishgenSource);

        // Execute script with __name__ set to 'fishgen' so CLI sys.exit(1) is skipped
        pyodide.runPython(`
mod_globals = {'__name__': 'fishgen'}
exec(fishgen_source_code, mod_globals)
FishTranspiler = mod_globals['FishTranspiler']
        `);

        statusEl.innerText = "Pyodide Ready!";
        statusEl.style.color = "#22c55e";
        btnEl.disabled = false;
        
        runTranspiler();
      } catch (err) {
        statusEl.innerText = "Initialization Failed: " + err.message;
        statusEl.style.color = "#ef4444";
        console.error(err);
      }
    }

    function runTranspiler() {
      if (!pyodide) return;

      const sourceCode = document.getElementById("inputCode").value;
      const outputEl = document.getElementById("outputCode");

      try {
        pyodide.globals.set("user_source_code", sourceCode);

        pyodide.runPython(`
transpiler = FishTranspiler()
transpiled_output = transpiler.transpile(user_source_code)
        `);

        outputEl.value = pyodide.globals.get("transpiled_output");
      } catch (err) {
        outputEl.value = "Transpilation Error:\n" + err.message;
      }
    }

    initPyodide();
  </script>

</body>
</html>
